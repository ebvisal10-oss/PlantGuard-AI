[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "plantguard-ai"
version = "1.0.0"
description = "PlantGuard AI - Crop Disease Detection & Agronomic Guidance"
readme = "README.md"
requires-python = ">=3.9"

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
